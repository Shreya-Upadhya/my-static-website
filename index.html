<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎮 Tic-Tac-Toe | Classic Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-wrapper">
    <h1>🎮 TIC-TAC-TOE</h1>

    <div class="mode-selector">
        <button class="mode-btn" id="vsHumanBtn">👥 vs Human</button>
        <button class="mode-btn active" id="vsAIBtn">🤖 vs AI</button>
    </div>

    <div class="status" id="statusMsg">Your turn (X)</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="popup" id="gameOverPopup">
        <div class="popup-content">
            <div class="popup-emoji" id="popupEmoji">🏆</div>
            <h2 id="popupTitle">Player X wins!</h2>
            <p id="popupSubtitle"></p>
            <button class="reset-btn" id="popupResetBtn">🔄 New Game</button>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-card">
            <h3>❌ Player X</h3>
            <div class="score X" id="scoreX">0</div>
        </div>
        <div class="score-card">
            <h3>⭕ Player O</h3>
            <div class="score O" id="scoreO">0</div>
        </div>
    </div>

    <footer>🚀 hosted on GitHub Pages | play with friends or AI</footer>
</div>

<script src="script.js"></script>
</body>
</html>
