<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎮 Tic-Tac-Toe | Classic Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-wrapper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            padding: 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }

        .sub {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .mode-btn {
            background: #f0f2f5;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .status {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px;
            margin: 15px 0;
            border-radius: 50px;
            background: #f0f2f5;
            color: #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #667eea;
            padding: 12px;
            border-radius: 25px;
            margin: 20px 0;
        }

        .cell {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cell:hover {
            transform: scale(1.02);
            background: #f8f9ff;
        }

        .cell.X {
            color: #667eea;
        }

        .cell.O {
            color: #764ba2;
        }

        .cell.winner {
            background: linear-gradient(135deg, #ffd89b, #c7e9fb);
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 20px 0;
        }

        .score-card {
            flex: 1;
            background: #f0f2f5;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
        }

        .score-card h3 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .score-card .score {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .score-card .score.X { color: #667eea; }
        .score-card .score.O { color: #764ba2; }

        .reset-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
            width: 100%;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        footer {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 20px;
            }
            .cell {
                font-size: 3rem;
            }
            .status {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <h1>🎮 TIC-TAC-TOE</h1>
    <div class="sub">classic strategy game</div>

    <div class="mode-selector">
        <button class="mode-btn" id="vsHumanBtn">👥 vs Human</button>
        <button class="mode-btn active" id="vsAIBtn">🤖 vs AI</button>
    </div>

    <div class="status" id="statusMsg">Your turn (X)</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="scoreboard">
        <div class="score-card">
            <h3>❌ Player X</h3>
            <div class="score X" id="scoreX">0</div>
        </div>
        <div class="score-card">
            <h3>⭕ Player O</h3>
            <div class="score O" id="scoreO">0</div>
        </div>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 New Game</button>
    <footer>🚀 hosted on GitHub Pages | play with friends or AI</footer>
</div>

<script>
    // Game state
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let isAIMode = true;
    let scoreX = 0;
    let scoreO = 0;

    // Winning combinations
    const winPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
        [0, 4, 8], [2, 4, 6]              // Diagonals
    ];

    // DOM elements
    const boardElement = document.getElementById('board');
    const statusMsg = document.getElementById('statusMsg');
    const scoreXElement = document.getElementById('scoreX');
    const scoreOElement = document.getElementById('scoreO');
    const resetBtn = document.getElementById('resetBtn');
    const vsHumanBtn = document.getElementById('vsHumanBtn');
    const vsAIBtn = document.getElementById('vsAIBtn');

    // Initialize game
    function init() {
        updateScores();
        resetGame();
        
        vsHumanBtn.addEventListener('click', () => {
            isAIMode = false;
            vsHumanBtn.classList.add('active');
            vsAIBtn.classList.remove('active');
            resetGame();
        });
        
        vsAIBtn.addEventListener('click', () => {
            isAIMode = true;
            vsAIBtn.classList.add('active');
            vsHumanBtn.classList.remove('active');
            resetGame();
        });
        
        resetBtn.addEventListener('click', () => resetGame());
    }

    // Reset game board
    function resetGame() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        statusMsg.innerHTML = isAIMode && currentPlayer === 'O' ? "AI is thinking... 🤖" : "Player X's turn (❌)";
        statusMsg.style.color = '#333';
        
        // Clear winner highlights
        document.querySelectorAll('.cell').forEach(cell => {
            cell.classList.remove('winner', 'X', 'O');
            cell.textContent = '';
        });
        
        // If AI starts (rare but possible) - we always let X start first
        // So AI will only move after X plays in AI mode
    }

    // Make a move
    function makeMove(index) {
        if (!gameActive || board[index] !== '') return false;
        
        // Place the mark
        board[index] = currentPlayer;
        const cell = document.querySelector(`.cell[data-index="${index}"]`);
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer);
        
        // Check win/draw
        if (checkWin()) {
            gameActive = false;
            statusMsg.innerHTML = `🎉 Player ${currentPlayer} wins! 🎉`;
            statusMsg.style.color = currentPlayer === 'X' ? '#667eea' : '#764ba2';
            if (currentPlayer === 'X') {
                scoreX++;
                updateScores();
            } else {
                scoreO++;
                updateScores();
            }
            highlightWinningCombo();
            return true;
        }
        
        if (checkDraw()) {
            gameActive = false;
            statusMsg.innerHTML = "🤝 It's a draw! 🤝";
            statusMsg.style.color = '#ff9800';
            return true;
        }
        
        // Switch player
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusMsg.innerHTML = getTurnMessage();
        
        // Trigger AI move if in AI mode and game still active
        if (isAIMode && gameActive && currentPlayer === 'O') {
            setTimeout(() => aiMove(), 300);
        }
        
        return true;
    }

    // Get turn message
    function getTurnMessage() {
        if (isAIMode && currentPlayer === 'O') {
            return "AI is thinking... 🤖";
        }
        return `Player ${currentPlayer}'s turn ${currentPlayer === 'X' ? '❌' : '⭕'}`;
    }

    // AI move using minimax algorithm (unbeatable)
    function aiMove() {
        if (!gameActive || currentPlayer !== 'O') return;
        
        const bestMove = getBestMove();
        if (bestMove !== -1) {
            makeMove(bestMove);
        }
    }

    // Get best move for AI using minimax
    function getBestMove() {
        let bestScore = -Infinity;
        let bestMove = -1;
        
        for (let i = 0; i < 9; i++) {
            if (board[i] === '') {
                board[i] = 'O';
                let score = minimax(board, 0, false);
                board[i] = '';
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }
        }
        return bestMove;
    }

    // Minimax algorithm
    function minimax(boardState, depth, isMaximizing) {
        // Check terminal states
        const winner = checkWinnerOnBoard(boardState);
        if (winner === 'O') return 10 - depth;
        if (winner === 'X') return depth - 10;
        if (isBoardFull(boardState)) return 0;
        
        if (isMaximizing) {
            let bestScore = -Infinity;
            for (let i = 0; i < 9; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'O';
                    let score = minimax(boardState, depth + 1, false);
                    boardState[i] = '';
                    bestScore = Math.max(score, bestScore);
                }
            }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (let i = 0; i < 9; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'X';
                    let score = minimax(boardState, depth + 1, true);
                    boardState[i] = '';
                    bestScore = Math.min(score, bestScore);
                }
            }
            return bestScore;
        }
    }

    // Check winner on a given board
    function checkWinnerOnBoard(boardState) {
        for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                return boardState[a];
            }
        }
        return null;
    }

    // Check if board is full
    function isBoardFull(boardState) {
        return boardState.every(cell => cell !== '');
    }

    // Check win on current board
    function checkWin() {
        return checkWinnerOnBoard(board) !== null;
    }

    // Check draw
    function checkDraw() {
        return isBoardFull(board) && !checkWin();
    }

    // Highlight winning cells
    function highlightWinningCombo() {
        for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                document.querySelector(`.cell[data-index="${a}"]`).classList.add('winner');
                document.querySelector(`.cell[data-index="${b}"]`).classList.add('winner');
                document.querySelector(`.cell[data-index="${c}"]`).classList.add('winner');
                break;
            }
        }
    }

    // Update scores display
    function updateScores() {
        scoreXElement.textContent = scoreX;
        scoreOElement.textContent = scoreO;
    }

    // Reset scores
    function resetScores() {
        scoreX = 0;
        scoreO = 0;
        updateScores();
        resetGame();
    }

    // Handle cell clicks
    function handleCellClick(e) {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        
        const index = parseInt(cell.dataset.index);
        
        // Check if it's AI mode and it's AI's turn
        if (isAIMode && currentPlayer === 'O') {
            statusMsg.innerHTML = "Wait for AI to move... 🤖";
            return;
        }
        
        // Check if it's 2-player mode and game is active
        if (!gameActive) {
            statusMsg.innerHTML = "Game over! Click New Game to play again!";
            return;
        }
        
        makeMove(index);
    }

    // Event listeners
    boardElement.addEventListener('click', handleCellClick);

    // Reset scores button (optional - double click reset btn for scores)
    let resetTimer;
    resetBtn.addEventListener('dblclick', () => {
        resetScores();
        statusMsg.innerHTML = "Scores reset! Starting new game...";
        setTimeout(() => {
            statusMsg.innerHTML = getTurnMessage();
        }, 1500);
    });

    // Start game
    init();
</script>
</body>
</html>
