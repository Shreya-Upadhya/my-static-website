<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎮 Tic-Tac-Toe | Classic Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Pixelify Sans', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-wrapper {
            background: rgba(10, 10, 20, 0.92);
            border-radius: 40px;
            padding: 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 0 60px rgba(0, 255, 200, 0.15), 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 2px solid rgba(0, 255, 200, 0.15);
            backdrop-filter: blur(20px);
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #00F5D4, #F15BB5, #FEE440);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 30px rgba(0, 245, 212, 0.5));
            letter-spacing: 2px;
        }

        .sub {
            color: #F15BB5;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(0, 255, 200, 0.25);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
            color: #00F5D4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mode-btn:hover {
            background: rgba(0, 245, 212, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.25);
            border-color: rgba(0, 245, 212, 0.5);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #00F5D4, #9B5DE5);
            color: #0a0a0a;
            border-color: transparent;
            box-shadow: 0 0 35px rgba(0, 245, 212, 0.5);
            font-weight: 900;
        }

        .status {
            font-size: 1.1rem;
            font-weight: 800;
            padding: 14px 20px;
            margin: 15px 0;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            color: #FFFFFF;
            border: 2px solid rgba(245, 91, 181, 0.25);
            letter-spacing: 0.5px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #050508;
            padding: 12px;
            border-radius: 25px;
            margin: 20px 0;
            border: 2px solid rgba(0, 245, 200, 0.1);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.04);
            text-shadow: 0 0 25px currentColor;
            position: relative;
            overflow: hidden;
        }

        .cell:hover {
            transform: scale(1.04);
            background: rgba(0, 245, 212, 0.06);
            border-color: rgba(0, 245, 212, 0.35);
            box-shadow: 0 0 30px rgba(0, 245, 212, 0.15);
        }

        .cell.X {
            color: #00F5D4;
            text-shadow: 0 0 35px rgba(0, 245, 212, 0.7);
        }

        .cell.O {
            color: #F15BB5;
            text-shadow: 0 0 35px rgba(245, 91, 181, 0.7);
        }

        .cell.winner {
            background: linear-gradient(135deg, rgba(0, 245, 212, 0.25), rgba(155, 93, 229, 0.25));
            animation: pulse 0.5s ease, neonGlow 1.2s ease-in-out infinite alternate;
            border-color: #00F5D4;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes neonGlow {
            from { box-shadow: 0 0 15px rgba(0, 245, 212, 0.3), inset 0 0 15px rgba(0, 245, 212, 0.1); }
            to { box-shadow: 0 0 35px rgba(0, 245, 212, 0.5), inset 0 0 25px rgba(0, 245, 212, 0.2); }
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 20px 0;
        }

        .score-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
        }

        .score-card h3 {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-card .score {
            font-size: 2.2rem;
            font-weight: 900;
        }

        .score-card .score.X {
            color: #00F5D4;
            text-shadow: 0 0 25px rgba(0, 245, 212, 0.5);
        }
        .score-card .score.O {
            color: #F15BB5;
            text-shadow: 0 0 25px rgba(245, 91, 181, 0.5);
        }

        .reset-btn {
            background: linear-gradient(135deg, #00F5D4, #9B5DE5);
            color: #0a0a0a;
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(0, 245, 212, 0.4);
            background: linear-gradient(135deg, #9B5DE5, #F15BB5);
        }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .popup.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: rgba(15, 15, 25, 0.98);
            border: 2px solid rgba(0, 245, 212, 0.3);
            border-radius: 35px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 245, 212, 0.25), 0 20px 50px rgba(0, 0, 0, 0.7);
            max-width: 450px;
            width: 90%;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.85) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .popup-emoji {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: bounceEmoji 1s ease infinite;
        }

        @keyframes bounceEmoji {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .popup-content h2 {
            background: linear-gradient(135deg, #00F5D4, #F15BB5, #FEE440);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .popup-content p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        footer {
            font-size: 0.7rem;
            color: #555;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 20px;
            }
            .cell {
                font-size: 3rem;
            }
            .status {
                font-size: 0.95rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <h1>🎮 TIC-TAC-TOE</h1>

    <div class="mode-selector">
        <button class="mode-btn" id="vsHumanBtn">👥 vs Human</button>
        <button class="mode-btn active" id="vsAIBtn">🤖 vs AI</button>
    </div>

    <div class="status" id="statusMsg">Your turn (X)</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="popup" id="gameOverPopup">
        <div class="popup-content">
            <div class="popup-emoji" id="popupEmoji">🏆</div>
            <h2 id="popupTitle">Player X wins!</h2>
            <p id="popupSubtitle"></p>
            <button class="reset-btn" id="popupResetBtn">🔄 New Game</button>
        </div>
    </div>

    <div class="scoreboard">
        <div class="score-card">
            <h3>❌ Player X</h3>
            <div class="score X" id="scoreX">0</div>
        </div>
        <div class="score-card">
            <h3>⭕ Player O</h3>
            <div class="score O" id="scoreO">0</div>
        </div>
    </div>

    <footer>🚀 hosted on GitHub Pages | play with friends or AI</footer>
</div>

<script>
    // Game state
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let isAIMode = true;
    let scoreX = 0;
    let scoreO = 0;

    // Winning combinations
    const winPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
        [0, 4, 8], [2, 4, 6]              // Diagonals
    ];

    // DOM elements
    const boardElement = document.getElementById('board');
    const statusMsg = document.getElementById('statusMsg');
    const scoreXElement = document.getElementById('scoreX');
    const scoreOElement = document.getElementById('scoreO');
    const vsHumanBtn = document.getElementById('vsHumanBtn');
    const vsAIBtn = document.getElementById('vsAIBtn');
    const gameOverPopup = document.getElementById('gameOverPopup');
    const popupTitle = document.getElementById('popupTitle');
    const popupSubtitle = document.getElementById('popupSubtitle');
    const popupEmoji = document.getElementById('popupEmoji');
    const popupResetBtn = document.getElementById('popupResetBtn');

    // Initialize game
    function init() {
        updateScores();
        resetGame();
        
        vsHumanBtn.addEventListener('click', () => {
            isAIMode = false;
            vsHumanBtn.classList.add('active');
            vsAIBtn.classList.remove('active');
            resetGame();
        });
        
        vsAIBtn.addEventListener('click', () => {
            isAIMode = true;
            vsAIBtn.classList.add('active');
            vsHumanBtn.classList.remove('active');
            resetGame();
        });
        
        popupResetBtn.addEventListener('click', () => {
            hideGameOverPopup();
            resetGame();
        });
    }

    // Reset game board
    function resetGame() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        statusMsg.innerHTML = isAIMode && currentPlayer === 'O' ? "AI is thinking... 🤖" : "Player X's turn (❌)";
        statusMsg.style.color = '#FFFFFF';
        
        // Clear winner highlights
        document.querySelectorAll('.cell').forEach(cell => {
            cell.classList.remove('winner', 'X', 'O');
            cell.textContent = '';
        });
        
        // If AI starts (rare but possible) - we always let X start first
        // So AI will only move after X plays in AI mode
    }

    // Make a move
    function makeMove(index) {
        if (!gameActive || board[index] !== '') return false;
        
        // Place the mark
        board[index] = currentPlayer;
        const cell = document.querySelector(`.cell[data-index="${index}"]`);
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer);
        
        // Check win/draw
        if (checkWin()) {
            gameActive = false;
            statusMsg.innerHTML = `🎉 Player ${currentPlayer} wins! 🎉`;
            statusMsg.style.color = currentPlayer === 'X' ? '#00F5D4' : '#F15BB5';
            if (currentPlayer === 'X') {
                scoreX++;
                updateScores();
            } else {
                scoreO++;
                updateScores();
            }
            highlightWinningCombo();
            showGameOverPopup(`Player ${currentPlayer} won!`, 'Nice move!', '🏆');
            return true;
        }
        
        if (checkDraw()) {
            gameActive = false;
            statusMsg.innerHTML = "🤝 It's a draw! 🤝";
            statusMsg.style.color = '#FF6600';
            showGameOverPopup("It's a tie!", 'Better luck next round', '🤝');
            return true;
        }
        
        // Switch player
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusMsg.innerHTML = getTurnMessage();
        
        // Trigger AI move if in AI mode and game still active
        if (isAIMode && gameActive && currentPlayer === 'O') {
            setTimeout(() => aiMove(), 300);
        }
        
        return true;
    }

    // Get turn message
    function getTurnMessage() {
        if (isAIMode && currentPlayer === 'O') {
            return "AI is thinking... 🤖";
        }
        return `Player ${currentPlayer}'s turn ${currentPlayer === 'X' ? '❌' : '⭕'}`;
    }

    // AI move using minimax algorithm (unbeatable)
    function aiMove() {
        if (!gameActive || currentPlayer !== 'O') return;
        
        const bestMove = getBestMove();
        if (bestMove !== -1) {
            makeMove(bestMove);
        }
    }

    // Get best move for AI using minimax
    function getBestMove() {
        let bestScore = -Infinity;
        let bestMove = -1;
        
        for (let i = 0; i < 9; i++) {
            if (board[i] === '') {
                board[i] = 'O';
                let score = minimax(board, 0, false);
                board[i] = '';
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }
        }
        return bestMove;
    }

    // Minimax algorithm
    function minimax(boardState, depth, isMaximizing) {
        // Check terminal states
        const winner = checkWinnerOnBoard(boardState);
        if (winner === 'O') return 10 - depth;
        if (winner === 'X') return depth - 10;
        if (isBoardFull(boardState)) return 0;
        
        if (isMaximizing) {
            let bestScore = -Infinity;
            for (let i = 0; i < 9; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'O';
                    let score = minimax(boardState, depth + 1, false);
                    boardState[i] = '';
                    bestScore = Math.max(score, bestScore);
                }
            }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (let i = 0; i < 9; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'X';
                    let score = minimax(boardState, depth + 1, true);
                    boardState[i] = '';
                    bestScore = Math.min(score, bestScore);
                }
            }
            return bestScore;
        }
    }

    // Check winner on a given board
    function checkWinnerOnBoard(boardState) {
        for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                return boardState[a];
            }
        }
        return null;
    }

    // Check if board is full
    function isBoardFull(boardState) {
        return boardState.every(cell => cell !== '');
    }

    // Check win on current board
    function checkWin() {
        return checkWinnerOnBoard(board) !== null;
    }

    // Check draw
    function checkDraw() {
        return isBoardFull(board) && !checkWin();
    }

    // Highlight winning cells
    function highlightWinningCombo() {
        for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                document.querySelector(`.cell[data-index="${a}"]`).classList.add('winner');
                document.querySelector(`.cell[data-index="${b}"]`).classList.add('winner');
                document.querySelector(`.cell[data-index="${c}"]`).classList.add('winner');
                break;
            }
        }
    }

    // Update scores display
    function updateScores() {
        scoreXElement.textContent = scoreX;
        scoreOElement.textContent = scoreO;
    }

    // Reset scores
    function resetScores() {
        scoreX = 0;
        scoreO = 0;
        updateScores();
        resetGame();
    }

    // Handle cell clicks
    function handleCellClick(e) {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        
        const index = parseInt(cell.dataset.index);
        
        // Check if it's AI mode and it's AI's turn
        if (isAIMode && currentPlayer === 'O') {
            statusMsg.innerHTML = "Wait for AI to move... 🤖";
            return;
        }
        
        makeMove(index);
    }

    // Event listeners
    boardElement.addEventListener('click', handleCellClick);

    // Popup helpers
    function showGameOverPopup(title, subtitle, emoji) {
        if (!gameOverPopup || !popupTitle || !popupSubtitle || !popupEmoji || !popupResetBtn) return;
        popupTitle.textContent = title;
        popupSubtitle.textContent = subtitle;
        popupEmoji.textContent = emoji || '🎮';
        gameOverPopup.classList.add('show');
        if (popupResetBtn) popupResetBtn.focus();
    }

    function hideGameOverPopup() {
        if (!gameOverPopup) return;
        gameOverPopup.classList.remove('show');
    }

    // Start game
    init();
</script>
</body>
</html>
